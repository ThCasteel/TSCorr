name: tscorr
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.10
  
  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  
  # Geospatial
  - gdal>=3.6
  - rasterio>=1.3
  - pyproj>=3.4
  - rioxarray>=0.14
  - xarray>=2023.1
  
  # Parallel processing
  - dask>=2023.1
  - distributed>=2023.1
  
  # Configuration
  - pyyaml>=6.0
  
  # Visualization (optional)
  - matplotlib>=3.6
  
  # Development tools (optional)
  - pip
  - pytest>=7.0
  - pytest-cov>=4.0
  - mypy>=1.0
  - black>=23.0
  - ruff>=0.1
  
  # Install package in development mode
  - pip:
    - -e .
